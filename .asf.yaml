github:
  description: "Apache XML Graphics Website"
  homepage: https://xmlgraphics.apache.org
  labels:
    - xmlgraphics
    - apache
  rulesets:
    - name: "Branch Protection Main"
      type: branch
      branches:
        includes:
          - "master"
      restrict_deletion: true
      restrict_force_push: true
      required_linear_history: true

staging:
  profile: ~
  whoami:  asf-staging

pelican:
  whoami: master
  target: asf-site
 
publish:
  whoami: asf-site
